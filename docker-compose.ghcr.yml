# Deploy zonder lokale build: gebruikt de image uit GitHub Actions (GHCR).
# Vereist dat workflow op main minstens één keer geslaagd is gepusht.

services:
  go2rtc:
    image: alexxit/go2rtc:latest
    restart: unless-stopped
    ports:
      - "${GO2RTC_PORT:-1984}:1984"
    volumes:
      - go2rtc-config:/config

  app:
    image: ${APP_IMAGE:-ghcr.io/s4ndyp/onvif-explorer:latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - go2rtc
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      GO2RTC_INTERNAL_URL: http://go2rtc:1984
      GO2RTC_PUBLIC_URL: ${GO2RTC_PUBLIC_URL:-http://localhost:1984}

volumes:
  go2rtc-config:
