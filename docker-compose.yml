services:
  go2rtc:
    image: alexxit/go2rtc:latest
    restart: unless-stopped
    ports:
      - "${GO2RTC_PORT:-1984}:1984"
    volumes:
      - go2rtc-config:/config

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_GO2RTC_PUBLIC_URL: ${GO2RTC_PUBLIC_URL:-http://localhost:1984}
    restart: unless-stopped
    depends_on:
      - go2rtc
    ports:
      # Alleen APP_PORT aanpassen (extern). In de container blijft de app op 8080.
      - "${APP_PORT:-8080}:8080"
    environment:
      APP_PORT: ${APP_PORT:-8080}
      HOST_NETWORK: "false"
      GO2RTC_INTERNAL_URL: http://go2rtc:1984
      GO2RTC_PUBLIC_URL: ${GO2RTC_PUBLIC_URL:-http://localhost:1984}
    # WS-Discovery (multicast): host network + HOST_NETWORK=true + APP_PORT=<poort>
    # network_mode: host

volumes:
  go2rtc-config:
